lor:#a64827}.neutral{background:#edf1fa;color:#365f99}.pill{border:1px solid var(--line);background:#f8faf9;padding:8px 12px;border-radius:7px;color:var(--ink)}.pill:hover{border-color:var(--teal)}.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px}.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}.filters select,.filters input{padding:8px 10px;border:1px solid #b7c8cc;background:#fff;border-radius:6px;max-width:220px;color:var(--ink)}.explorer{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px}.list{max-height:790px;overflow:auto;padding:0}.casebutton{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e0e8e9;background:white;padding:14px 16px;color:var(--ink);line-height:1.4}.casebutton:hover{background:#edf7f5}.casebutton.active{background:#e5f2ed;border-left:4px solid var(--teal);padding-left:12px}.casebutton code{font-size:11px;display:block;overflow-wrap:anywhere;margin:6px 0}.casebutton small{font-size:12px}.casehead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.caseid{font-size:12px;overflow-wrap:anywhere;color:var(--muted)}.state{background:#f5f7f6;border:1px solid #e1e8e6;border-radius:8px;padding:17px;margin:15px 0;overflow-wrap:anywhere}.state ol{padding-left:25px;margin:10px 0}.state li{margin:8px 0}.state p{margin:0 0 10px}.option{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:13px 16px}.option.gold{border:2px solid var(--teal);padding:12px 15px}.option.chosen:not(.gold){border:2px solid var(--orange);padding:12px 15px}.optiontop{display:flex;align-items:center;gap:9px}.optiontop strong:last-child{margin-left:auto;font-variant-numeric:tabular-nums}.probtrack{background:#e8edee;height:5px;margin:9px 0 12px;border-radius:2px;overflow:hidden}.probtrack i{height:100%;display:block;background:#819fba}.gold .probtrack i{background:var(--teal)}.chosen:not(.gold) .probtrack i{background:var(--orange)}pre{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f7;padding:14px;border-radius:6px;font:12px/1.6 ui-monospace,monospace}details{margin:15px 0}summary{cursor:pointer;color:var(--blue)}.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.example{display:block;width:100%;text-align:left;background:#fafbf8;border:1px solid var(--line);border-radius:8px;padding:15px;margin-top:12px;color:var(--ink)}.example strong{display:block}.example:hover{border-color:var(--teal)}.boards{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin:22px 0}.board{display:grid;grid-template-columns:repeat(10,15px);gap:1px;background:#173543;border:7px solid #173543;border-radius:4px;width:max-content}.cell{width:15px;height:15px;background:#234451}.cell.filled{background:#58c5af}.boardlabel{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}footer{font-size:12px;color:var(--muted);margin-top:24px}.chart{width:100%;height:auto;display:block}.svg-label{font:14px system-ui,sans-serif;fill:var(--ink)}[hidden]{display:none!important}@media(max-width:1000px){.twocol{grid-template-columns:1fr}.explorer{grid-template-columns:270px minmax(0,1fr)}.panel{padding:18px}}@media(max-width:700px){header{padding:25px 16px 0}nav button{padding:12px 11px;font-size:13px}main{padding:18px 12px}.cards{grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:15px}.card strong{font-size:25px}.explorer{display:block}.list{max-height:240px;margin-bottom:18px}.filters{gap:8px}.filters select{max-width:165px}.panel{padding:17px}.boards{gap:14px}table{font-size:12px}th,td{padding:9px 7px}}

<header><div class="eyebrow">LIQUID d1:free / ORIGINAL DECISION EVALUATION</div><h1>判断の強さと、つまずく境界</h1><p>規則の例外・状態の更新・複数制約を、自前の問題で測定。2026年9月30日の保存済み結果です。</p><nav role="tablist" aria-label="表示内容"><button role="tab" data-tab="overview" aria-selected="true">主要結果</button><button role="tab" data-tab="cases" aria-selected="false">問題と回答</button><button role="tab" data-tab="basic" aria-selected="false">基本動作</button><button role="tab" data-tab="tetris" aria-selected="false">静止テトリス</button></nav></header>
<main><section id="overview" role="tabpanel"></section><section id="cases" role="tabpanel" hidden><div class="filters"><label>課題<select id="family"><option value="">すべて</option><option value="policy">例外付き規則</option><option value="temporal">状態追跡</option><option value="schedule">作業割当</option></select></label><label>難易度<select id="difficulty"><option value="">すべて</option><option>easy</option><option>medium</option><option>hard</option></select></label><label>言語<select id="language"><option value="">日英</option><option value="ja">日本語</option><option value="en">英語</option></select></label><label>結果<select id="correct"><option value="">すべて</option><option value="wrong">誤答</option><option value="right">正答</option><option value="confident_wrong">確率90%以上の誤答</option></select></label><label>試験<select id="variant"><option value="canonical">独立した本問</option><option value="reverse">候補の割当反転</option><option value="translation">日英の変更</option><option value="identical_repeat">同一入力の再送</option><option value="">すべて</option></select></label></div><p id="casecount" class="muted" aria-live="polite"></p><div class="explorer"><div id="caselist" class="panel list"></div><article id="detail" class="panel"></article></div></section>
<section id="basic" role="tabpanel" hidden></section><section id="tetris" role="tabpanel" hidden></section>
<footer><a href="RESULTS.md">詳細レポート</a> · <a href="dataset/README.md">データセット仕様</a> · <a href="final-summary.json">集計JSON</a> · <a href="runs/">生ログ</a><p>オフラインで閲覧できます。この画面からAPIへの送信は行いません。</p></footer></main>

<script>
'use strict';
const D=JSON.parse(document.querySelector('#results').textContent),S=D.summary,H=D.hard,L=D.labels;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(x,d=1)=>(100*x).toFixed(d)+'%',json=v=>'<pre>'+esc(JSON.stringify(v,null,2))+'</pre>',badge=(t,c='')=>'<span class="badge '+c+'">'+esc(t)+'</span>';
const table=(heads,rows)=>'<div class="tablewrap"><table><thead><tr>'+heads.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function tab(id){document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!==id);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id?'true':'false'));}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function chart(){let a='<svg class="chart" viewBox="0 0 640 258" role="img" aria-label="hard各120問の正答率と95%Wilson区間。偶然水準25%。">';const left=155,w=430;
for(let i=0;i<=4;i++){const x=left+i*w/4;a+=`<line x1="${x}" x2="${x}" y1="22" y2="215" stroke="${i===1?'#ac7542':'#e2e9e9'}" ${i===1?'stroke-dasharray="5 4"':''}/><text x="${x}" y="239" text-anchor="middle" class="svg-label" style="font-size:12px">${i*25}%</text>`;}
H.primary.forEach((r,i)=>{let y=48+i*68;const x=left+r.accuracy*w,lo=left+r.wilson_95[0]*w,hi=left+r.wilson_95[1]*w;a+=`<text x="140" y="${y+5}" text-anchor="end" class="svg-label">${['例外付き規則','状態追跡','作業割当'][i]}</text><rect x="${left}" y="${y-12}" width="${r.accuracy*w}" height="24" rx="3" fill="${r.above_chance_familywise_05?'#0e8876':'#8094a6'}" opacity=".3"/><line x1="${lo}" x2="${hi}" y1="${y}" y2="${y}" stroke="#224c55" stroke-width="2"/><line x1="${lo}" x2="${lo}" y1="${y-6}" y2="${y+6}" stroke="#224c55"/><line x1="${hi}" x2="${hi}" y1="${y-6}" y2="${y+6}" stroke="#224c55"/><circle cx="${x}" cy="${y}" r="5" fill="#0c7265"/><text x="${hi+12}" y="${y+5}" class="svg-label" style="font-weight:700">${pct(r.accuracy)}</text>`;});return a+'</svg>';}
function overview(){const conf=S.confidence_subsets[0];$('#overview').innerHTML=`<div class="cards"><div class="card"><strong>552</strong><span>独立した問題 · 正解はコードで検証</span></div><div class="card"><strong>120</strong><span>日英・候補割当を変えた対応試験</span></div><div class="card"><strong>${S.repeat_completed} / 60</strong><span>同一入力の再送対照</span></div><div class="card"><strong>${S.api_attempts}</strong><span>全API試行 · 通信失敗も含む</span></div></div><div class="twocol"><div class="panel"><h2>規則と割当は偶然を超える。<br>状態の追跡には弱さが残る。</h2><p class="muted">hard各120問。点は正答率、横線は95%Wilson区間。点線は4択の偶然水準25%。</p>${chart()}${table(['課題','正答','Holm補正p値'],H.primary.map(r=>[esc(L[r.family]),`${r.correct}/${r.n}`,r.holm_adjusted_p<.001?r.holm_adjusted_p.toExponential(2):r.holm_adjusted_p.toFixed(3)]))}<div class="callout">55〜57%でも4割以上は誤答しています。有意差は、複雑な判断を単独で任せられることを意味しません。</div></div><div class="panel"><h2>「高い確率」も検証が必要</h2><p>選択候補に90%以上の確率を付けた${conf.n}問のうち、<strong>${conf.errors}問が誤答</strong>でした。独立552問だけの集計です。</p><button class="example" data-example="schedule-easy-en-011"><strong>時間枠3限定の仕事を、時間枠2へ</strong><span class="muted">誤った割当案を97.7%で選択 → 入力を確認</span></button><button class="example" data-example="temporal-easy-en-015"><strong>2回の交換で元に戻るはずが…</strong><span class="muted">5イベントの短い状態追跡でも誤答 → 入力を確認</span></button><h3>条件を変えると回答はどう動くか</h3>${table(['課題','候補反転','日英変更','同じ入力'],Object.keys(L).map(f=>{let x=H.robustness.filter(r=>r.family===f),r=S.repeat.find(r=>r.family===f);return [esc(f==='policy'?'規則':f==='temporal'?'状態追跡':'割当'),x[0].flips+'/'+x[0].n,x[1].flips+'/'+x[1].n,r.flips+'/'+r.n]}))}<p class="muted"><small>選んだ内容が変わった件数。同一問題の対応比較であり、独立標本に加えていません。同一入力対照は本試験後に追加。</small></p></div></div><div class="panel"><h2>複雑さと言語別の内訳</h2>${table(['課題','easy','medium','hard','hard英語','hard日本語'],Object.keys(L).map(f=>[esc(L[f]),...([['easy','all'],['medium','all'],['hard','all'],['hard','en'],['hard','ja']].map(([d,l])=>{const r=H.all_cells.find(x=>x.family===f&&x.difficulty===d&&x.language===l);return `<span class="num">${r.correct}/${r.n} · ${pct(r.accuracy)}</span>`}))]))}<p class="muted">各群easy32・medium32・hard120問。難易度名は生成器の複雑さで、人間による評定ではありません。独立した英語・日本語の問題は異なるため、この内訳だけから言語差を断定しません。</p></div>`;document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>jump(b.dataset.example));}
let selected='temporal-easy-en-015';
function renderState(c){const s=c.payload.state;let body='<p>'+esc(s.task)+'</p>';
if(c.family==='policy'){body+='<p class="muted">'+esc(s.field_definitions)+'</p>'+table(['事実','値'],Object.entries(s.facts).map(([k,v])=>[esc(k),esc(v)]))+'<ol>'+s.rules.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><p>既定の操作: '+esc(s.default_action)+'</p>';}
if(c.family==='temporal'){body+=table(['容器','初期位置'],Object.entries(s.initial_locations).map(([k,v])=>[esc(k),esc(v)]))+'<ol>'+s.events.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><p><strong>取消ID:</strong> '+esc(s.cancelled_event_ids.join(', ')||'なし')+'</p>';}
if(c.family==='schedule'){body+=table(['作業','許可された担当者','許可された時間枠'],Object.entries(s.allowed_assignments).map(([k,v])=>[esc(k),esc(v.workers.join(', ')),esc(v.slots.join(', '))]))+'<p><strong>前後関係:</strong> '+esc(s.precedence.map(x=>x.join(' → ')).join(', ')||'なし')+'</p>';}
return '<div class="state">'+body+'</div>';}
function optionBody(f,v){if(f==='schedule')return table(['作業','担当','時間枠'],Object.entries(v).map(([job,a])=>[esc(job),esc(a.worker),esc(a.slot)]));return '<div>'+esc(v)+'</div>';}
function detail(){const c=D.cases.find(x=>x.id===selected);if(!c){$('#detail').innerHTML='<p class="muted">条件に合う問題を選択してください。</p>';return;}const a=c.answer;const q=c.payload.questions.decision;let body=`<div class="casehead">${badge(L[c.family])}${badge(c.difficulty)}${badge(c.language==='ja'?'日本語':'英語')}${badge(c.correct===null?'未取得':c.correct?'正答':'誤答',c.correct===null?'':c.correct?'ok':'bad')}</div><div class="caseid">${esc(c.id)}</div><h2 style="margin-top:15px">${esc(q.instructions)}</h2>${renderState(c)}<h3>候補とモデルの確率</h3>`;
for(const [label,value] of Object.entries(q.criteria)){let gold=label===c.gold_choice,chosen=a&&label===a.choice,p=a?a.probabilities[label]:null;body+=`<div class="option ${gold?'gold':''} ${chosen?'chosen':''}"><div class="optiontop"><strong>${esc(label)}</strong>${gold?badge('正解','ok'):''}${chosen?badge('d1の回答',gold?'ok':'bad'):''}<strong>${p===null?'未取得':pct(p,2)}</strong></div><div class="probtrack"><i style="width:${p===null?0:p*100}%"></i></div>${optionBody(c.family,value)}</div>`;}
body+='<details><summary>正解を支える検証結果（モデルの思考過程ではありません）</summary>'+json(c.witness)+'</details><details><summary>実際に送信したJSONを表示</summary>'+json(c.payload)+'</details>';
let base=c.base_id||c.id,related=D.cases.filter(x=>(x.base_id||x.id)===base&&x.id!==c.id);body+='<div class="linkrow">'+related.map(x=>`<button class="pill" data-related="${esc(x.id)}">${esc({canonical:'元の問題',reverse:'候補反転',translation:'別言語',identical_repeat:'同一入力の再送'}[x.variant])}</button>`).join('')+'</div>';$('#detail').innerHTML=body;document.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>jump(b.dataset.related));}
function list(){let rows=D.cases.filter(c=>['family','difficulty','language','variant'].every(k=>!$('#'+k).value||c[k]===$('#'+k).value));const result=$('#correct').value;if(result)rows=rows.filter(c=>result==='right'?c.correct===true:result==='wrong'?c.correct===false:c.correct===false&&c.answer&&c.answer.probabilities[c.answer.choice]>=.9);rows.sort((a,b)=>a.id.localeCompare(b.id));if(!rows.length)selected=null;$('#casecount').textContent=rows.length+'件を表示 / 保存した本問・変形・再送予定は732件';$('#caselist').innerHTML=rows.map(c=>`<button class="casebutton ${c.id===selected?'active':''}" data-id="${esc(c.id)}">${badge(c.correct===null?'未取得':c.correct?'正答':'誤答',c.correct===null?'':c.correct?'ok':'bad')} <small>${esc(c.difficulty)} · ${esc(c.language)}</small><code>${esc(c.id)}</code><small>回答 ${esc(c.answer?.choice||'—')} / 正解 ${esc(c.gold_choice)}${c.answer?' · '+pct(c.answer.probabilities[c.answer.choice],1):''}</small></button>`).join('')||'<p style="padding:15px">条件に合う問題はありません。</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;list();detail()});if(rows.length&&!rows.some(c=>c.id===selected)){selected=rows[0].id;list();detail();}}
function jump(id){const c=D.cases.find(x=>x.id===id);selected=id;for(let k of ['family','difficulty','language','correct'])$('#'+k).value='';$('#variant').value=c.variant;list();detail();tab('cases');window.scrollTo({top:0,behavior:'smooth'});}
for(let k of ['family','difficulty','language','correct','variant'])$('#'+k).onchange=()=>{list();detail()};
function basic(){const names={problem:'Noul: 現在の問題',department:'Choice: 担当部署',urgency:'Score: 影響度の最頻段階'};$('#basic').innerHTML=`<div class="panel"><h2>日英24入力の基本動作</h2>${table(['判定','正答'],Object.entries(S.basic).map(([k,v])=>[esc(names[k]),v.correct+'/'+v.n]))}<p>Scoreは0〜3の評価段階に対する確率分布の最頻値で採点。期待値そのものの丸めではありません。</p><p class="muted">基本・反復・派生・診断・不正入力の計61ケース。正常応答の型と確率も検査しました。診断6問は基本正答率から分離しています。</p></div><div class="panel"><label>入力と回答を選択 <select id="basicselect" style="max-width:100%;padding:8px"></select></label><div id="basicdetail"></div></div>`;$('#basicselect').innerHTML=D.basic.map((x,i)=>`<option value="${i}">${esc(x.fixture.id)} (${esc(x.fixture.family)})</option>`).join('');$('#basicselect').onchange=()=>{const x=D.basic[+$('#basicselect').value];$('#basicdetail').innerHTML='<h3>入力</h3>'+json(x.fixture.payload)+'<h3>採点</h3>'+json(x.result?.evaluation||x.fixture.gold||'不正入力の応答は生ログ参照')+'<details open><summary>APIの回答</summary>'+json(x.result?.response||null)+'</details>'};$('#basicselect').onchange();}
function board(b){const rows=Array(b.empty_top_rows||0).fill('..........').concat(b.rows||[]);return '<div class="board">'+rows.flatMap(r=>[...r].map(v=>'<i class="cell '+(v==='#'?'filled':'')+'"></i>')).join('')+'</div>';}
function tetris(){const hist=S.static.historical;$('#tetris').innerHTML=`<div class="panel"><h2>静止局面での候補選択</h2><p><strong>直ちに消える行数を最大化: 12/12</strong>。同じ12局面の候補順反転も12/12。過去のJevの選択との一致は${hist.same_as_historical_jev}/${hist.n}で、正解率ではありません。</p><div class="callout">候補の盤面と消去行数はコードが計算して渡しています。実時間テトリスは延期し、自律プレイの成績は測っていません。</div><div class="filters"><label>局面<select id="tetrisselect"></select></label><label>表示する候補<select id="moveselect"></select></label></div><div id="tetrisdetail"></div></div>`;$('#tetrisselect').innerHTML=D.static.map((x,i)=>`<option value="${i}">${esc(x.fixture.id)}</option>`).join('');function select(){const x=D.static[+$('#tetrisselect').value],a=x.result.response.answers.move;$('#moveselect').innerHTML=Object.entries(x.fixture.payload.questions.move.criteria).map(([k])=>`<option value="${esc(k)}">${esc(k)}${k===a.choice?' ← d1':''}</option>`).join('');$('#moveselect').value=a.choice;render();}function render(){const x=D.static[+$('#tetrisselect').value],f=x.fixture,a=x.result.response.answers.move,key=$('#moveselect').value,opt=f.payload.questions.move.criteria[key];$('#tetrisdetail').innerHTML=`<p>${esc(f.payload.questions.move.instructions)}</p><p>d1の選択: <strong>${esc(a.choice)}</strong> · 表示候補の確率: ${pct(a.probabilities[key],2)} · 消去行数: <strong>${opt.rows_cleared}</strong></p><div class="boards"><div>${board(f.payload.state.board)}<div class="boardlabel">入力盤面 / ピース ${esc(f.payload.state.current_piece)}</div></div><div>${board(opt.after_lock_and_row_clear)}<div class="boardlabel">選択中の候補を置いた後</div></div></div><details><summary>全入力・API応答</summary>${json(f.payload)}${json(x.result.response)}</details>`;}$('#tetrisselect').onchange=select;$('#moveselect').onchange=render;select();}
overview();list();detail();basic();tetris();
</script></body></html>
